<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<meta name="theme-color" content="#0d9488" />
<title>Offline — Doctorooms</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { height: 100%; }
  body {
    font-family: system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif;
    background: linear-gradient(160deg, #f0fdfa 0%, #ffffff 60%);
    color: #134e4a;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 24px;
    -webkit-font-smoothing: antialiased;
  }
  .card {
    max-width: 420px;
    width: 100%;
    text-align: center;
    background: #ffffff;
    border: 1px solid #ccfbf1;
    border-radius: 20px;
    padding: 44px 32px 36px;
    box-shadow: 0 12px 40px rgba(13, 148, 136, 0.12);
  }
  .logo {
    width: 72px; height: 72px;
    margin: 0 auto 20px;
    border-radius: 18px;
    background: linear-gradient(135deg, #14b8a6, #0f766e);
    display: flex; align-items: center; justify-content: center;
    position: relative;
  }
  .logo svg { width: 40px; height: 40px; }
  .pulse {
    display: block;
    margin: 24px auto 26px;
    width: 200px; height: 40px;
  }
  .pulse path {
    fill: none;
    stroke: #0d9488;
    stroke-width: 2.5;
    stroke-linecap: round;
    stroke-linejoin: round;
    stroke-dasharray: 420;
    stroke-dashoffset: 420;
    animation: trace 2.4s linear infinite;
    opacity: 0.85;
  }
  @keyframes trace {
    0% { stroke-dashoffset: 420; }
    55% { stroke-dashoffset: 0; }
    80% { stroke-dashoffset: 0; opacity: 0.85; }
    100% { stroke-dashoffset: -420; opacity: 0.4; }
  }
  h1 { font-size: 22px; font-weight: 700; color: #0f766e; margin-bottom: 10px; }
  p { font-size: 14.5px; line-height: 1.6; color: #0f766e99; margin-bottom: 26px; }
  .hint {
    font-size: 12.5px;
    color: #0f766e80;
    background: #f0fdfa;
    border: 1px dashed #99f6e4;
    border-radius: 10px;
    padding: 10px 14px;
    margin-bottom: 26px;
    line-height: 1.5;
  }
  .retry {
    display: inline-flex;
    align-items: center;
    gap: 8px;
    background: linear-gradient(135deg, #14b8a6, #0d9488);
    color: #ffffff;
    border: none;
    border-radius: 12px;
    padding: 13px 28px;
    font-size: 15px;
    font-weight: 600;
    cursor: pointer;
    transition: transform 0.15s ease, box-shadow 0.15s ease;
    box-shadow: 0 6px 18px rgba(13, 148, 136, 0.35);
  }
  .retry:hover { transform: translateY(-1px); box-shadow: 0 8px 22px rgba(13, 148, 136, 0.45); }
  .retry:active { transform: translateY(0); }
  .retry svg { width: 16px; height: 16px; }
  .status {
    margin-top: 18px;
    font-size: 12px;
    color: #0f766e70;
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 7px;
  }
  .dot {
    width: 8px; height: 8px;
    border-radius: 50%;
    background: #f59e0b;
    animation: blink 1.6s ease infinite;
  }
  .dot.online { background: #10b981; animation: none; }
  @keyframes blink { 0%, 100% { opacity: 0.35; } 50% { opacity: 1; } }
</style>
</head>
<body>
  <main class="card" role="main">
    <div class="logo" aria-hidden="true">
      <svg viewBox="0 0 512 512" xmlns="http://www.w3.org/2000/svg">
        <path fill="#ffffff" fill-rule="evenodd"
          d="M150 136 H236 C328 136 394 175 394 256 C394 337 328 376 236 376 H150 Z
             M212 198 H258 C306 198 338 222 338 256 C338 290 306 314 258 314 H212 Z"/>
      </svg>
    </div>

    <h1>You&rsquo;re offline</h1>
    <p>Doctorooms needs an internet connection to load your dashboard. Your data is safe &mdash; nothing was lost.</p>

    <svg class="pulse" viewBox="0 0 200 40" aria-hidden="true">
      <path d="M2 20 h48 l10 -12 12 24 10 -18 6 6 h110" />
    </svg>

    <div class="hint">Tip: cached pages like the app icon and login screen still open without internet.</div>

    <button class="retry" onclick="location.reload()" aria-label="Retry connection">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
        <path d="M21 12a9 9 0 1 1-2.64-6.36"/><path d="M21 3v6h-6"/>
      </svg>
      Try Again
    </button>

    <div class="status" id="status">
      <span class="dot" id="dot"></span>
      <span id="label">Waiting for connection&hellip;</span>
    </div>
  </main>

<script>
  var dot = document.getElementById('dot');
  var label = document.getElementById('label');
  function sync() {
    var on = navigator.onLine;
    dot.className = 'dot' + (on ? ' online' : '');
    label.textContent = on ? 'Back online — reloading\u2026' : 'Waiting for connection\u2026';
    if (on) setTimeout(function () { location.replace('/'); }, 600);
  }
  window.addEventListener('online', sync);
  window.addEventListener('offline', sync);
  sync();
</script>
</body>
</html>
